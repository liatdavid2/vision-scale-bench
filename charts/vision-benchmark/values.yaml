image:
  repository: REPLACE_ME
  tag: latest
  pullPolicy: Always
trainer:
  replicas: 2
  epochs: 1
  batchSize: 128
  maxTrainSamples: 5000
  maxTestSamples: 1000
  masterPort: 29500
  nodeSelector:
    workload: vision-bench
  resources:
    requests:
      cpu: "1500m"
      memory: "3Gi"
      nvidia.com/gpu: "1"
    limits:
      cpu: "3500m"
      memory: "12Gi"
      nvidia.com/gpu: "1"
